// ============================================================
//  手机触控：左右滑动翻页 / 单点凸出选中 / 直接拖动
// ============================================================
if (IS_MOBILE) {
  const SWIPE_STEP = 3;          // 一次滑动翻几张
  let _fanTouch = null;          // 当前触控状态

  // 手机端选中（单点凸出）：点其他牌自动切换，不再同牌取消
  function selectFanCardMobile(gi) {
    if (présSelectedIdx >= 0 && présSelectedIdx !== gi) {
      const oldEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === présSelectedIdx);
      if (oldEl) oldEl.classList.remove('preselected');
    }
    présSelectedIdx = gi;
    fanCardEls.forEach(el => el.classList.toggle('preselected', parseInt(el.dataset.globalIdx) === gi));
  }
  // 手机端取消：单击空白区域
  function deselectFanCardMobile() {
    if (présSelectedIdx < 0) return;
    const oldEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === présSelectedIdx);
    if (oldEl) oldEl.classList.remove('preselected');
    présSelectedIdx = -1;
  }

  // 翻页（dir: -1 左滑看上一批，+1 右滑看下一批）
  function fanStep(dir) {
    const total = currentDeck.length;
    const centerIdx = total / 2 + rotationOffset;
    if (dir < 0 && Math.floor(centerIdx - WINDOW_HALF) > 0) { rotationOffset -= SWIPE_STEP; _enterFromLeft = true; renderFanWindow(); }
    else if (dir > 0 && Math.ceil(centerIdx + WINDOW_HALF) < total - 1) { rotationOffset += SWIPE_STEP; _enterFromLeft = false; renderFanWindow(); }
  }

  // 把牌从扇形取出、跟随手指（上滑拖出）
  function startTouchDragOut(globalIdx, tx, ty) {
    const card = currentDeck[globalIdx];
    if (!card) return null;
    const srcEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === globalIdx);
    if (!srcEl) return null;
    // 记录扇形中当前尺寸（已含 fanScale 缩放），拖拽中保持与扇形一致
    srcEl.style.transition = 'none';
    const layW = srcEl.offsetWidth, layH = srcEl.offsetHeight;   // 布局尺寸（图片真实比例）
    const srcRect = srcEl.getBoundingClientRect();   // 视觉初始位置（含扇形排布）
    const cw = layW * fanScale, ch = layH * fanScale;   // 拖拽视觉尺寸（未旋转，用于放手定位）
    const startLeft = srcRect.left, startTop = srcRect.top;
    const offsetX = tx - startLeft, offsetY = ty - startTop;

    fanScroll.style.pointerEvents = 'none';
    fanCardEls = fanCardEls.filter(el => el !== srcEl);
    srcEl.classList.remove('preselected');
    srcEl.style.transformOrigin = '50% 50%';
    srcEl.style.position = 'fixed';       // 不脱离 fanScroll，避免触摸被取消
    srcEl.style.left = startLeft + 'px';
    srcEl.style.top  = startTop + 'px';
    srcEl.style.zIndex = '9999';
    srcEl.style.pointerEvents = 'none';
    srcEl.style.transform = 'rotate(-5deg) scale(' + fanScale + ')';   // 保留扇形缩放，大小与扇形一致
    const inner = srcEl.querySelector('.card-inner');
    if (inner) {
      const isNoir = document.body.dataset.theme === 'noir';
      inner.style.boxShadow = isNoir ? '0 8px 24px rgba(0,0,0,.28)' : '0 8px 32px rgba(180,100,255,0.4)';
      inner.style.borderColor = isNoir ? '#17171a' : '#b080ff';
    }
    return { srcEl, cw, ch, card, gi: globalIdx, offsetX, offsetY, layW, layH };
  }

  fanScroll.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;               // 只响应左键 / 触摸
    const cardEl = e.target.closest('.fan-card');
    const gi = cardEl ? parseInt(cardEl.dataset.globalIdx) : -1;
    // 按在牌上 → 立即选中凸出（单点=选中，可直接拖动）
    if (gi >= 0) selectFanCardMobile(gi);
    _fanTouch = {
      sx: e.clientX, sy: e.clientY,
      moved: false, mode: null,
      gi,
      drag: null,
    };
    try { fanScroll.setPointerCapture(e.pointerId); } catch (_) {}
  });

  fanScroll.addEventListener('pointermove', (e) => {
    if (!_fanTouch) return;
    const dx = e.clientX - _fanTouch.sx;
    const dy = e.clientY - _fanTouch.sy;

    if (Math.hypot(dx, dy) > 10) _fanTouch.moved = true;

    // 模式判定：按在牌上任意方向移动→直接拖出；按在空白横向滑动→翻页
    // （空白处竖直滑动缩放由全局 handler 处理，覆盖整个页面空白区）
    if (!_fanTouch.mode) {
      if (_fanTouch.gi >= 0 && Math.hypot(dx, dy) > 18) {
        _fanTouch.mode = 'drag';
      } else if (_fanTouch.gi < 0 && Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(dy)) {
        _fanTouch.mode = 'swipe';
      }
    }

    if (_fanTouch.mode === 'drag') {
      e.preventDefault();
      if (!_fanTouch.drag) {
        _fanTouch.drag = startTouchDragOut(_fanTouch.gi, _fanTouch.sx, _fanTouch.sy);
        if (!_fanTouch.drag) { _fanTouch.mode = 'swipe'; return; }
      }
      _fanTouch.drag.srcEl.style.left = (e.clientX - _fanTouch.drag.offsetX) + 'px';
      _fanTouch.drag.srcEl.style.top  = (e.clientY - _fanTouch.drag.offsetY) + 'px';
    } else if (_fanTouch.mode === 'swipe') {
      e.preventDefault();
    }
  }, { passive: false });

  fanScroll.addEventListener('pointerup', (e) => {
    if (!_fanTouch) return;
    const dx = e.clientX - _fanTouch.sx;
    const dy = e.clientY - _fanTouch.sy;
    const st = _fanTouch;
    _fanTouch = null;
    _suppressClick = true;
    if (e.cancelable) e.preventDefault();   // 抑制合成 click，避免重复触发
    setTimeout(() => { _suppressClick = false; }, 0);

    if (st.mode === 'drag' && st.drag) {
      // 拖出结束 → 放到桌面
      const d = st.drag;
      d.srcEl.remove();
      fanScroll.style.pointerEvents = '';
      let relX = e.clientX - d.cw / 2;
      let relY = e.clientY - d.ch / 2;
      relX = Math.max(0, Math.min(relX, window.innerWidth - d.cw));
      relY = Math.max(60, Math.min(relY, window.innerHeight - d.ch));
      placeCardAt(d.card, d.gi, relX, relY, d.layW, d.layH);
    } else if (st.mode === 'swipe' && st.moved && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      // 左右滑动翻页
      fanStep(dx > 0 ? -1 : 1);
    } else if (!st.moved) {
      // 轻点牌已在 pointerdown 时选中凸出；单击空白 → 取消选中
      if (st.gi < 0) deselectFanCardMobile();
    }
  });

  // 指针被系统打断（来电/手势等）时的兜底：已拖出的牌照常放下
  fanScroll.addEventListener('pointercancel', (e) => {
    if (!_fanTouch) { fanScroll.style.pointerEvents = ''; return; }
    const st = _fanTouch;
    _fanTouch = null;
    if (st.drag) {
      const d = st.drag;
      d.srcEl.remove();
      fanScroll.style.pointerEvents = '';
      let relX = e.clientX - d.cw / 2;
      let relY = e.clientY - d.ch / 2;
      relX = Math.max(0, Math.min(relX, window.innerWidth - d.cw));
      relY = Math.max(60, Math.min(relY, window.innerHeight - d.ch));
      placeCardAt(d.card, d.gi, relX, relY, d.layW, d.layH);
    } else {
      fanScroll.style.pointerEvents = '';
    }
  });

  // ===== 全局空白处竖直滑动：上滑放大 / 下滑缩小（桌面 + 扇形空白都有效） =====
  let _docZoom = null;
  const ZOOM_MIN = 0.6, ZOOM_MAX = 1.8;
  function isInteractiveTarget(t) {
    return !!(t && t.closest && t.closest(
      '.fan-card, .placed-card, .drawer, .drawer-item, .drawer-tab, .side-tab, ' +
      'button, a, input, textarea, .fan-arrow, .record-item, #recordPage, #captureOverlay, #cardZoom'
    ));
  }
  // 应用缩放：扇形牌与桌面放置牌同步（扇形牌缩放时禁用过渡，避免滞后）
  function applyFanScale() {
    fanCardEls.forEach(el => {
      el.style.transition = 'none';
      applyCardPosition(el, parseInt(el.dataset.globalIdx));
    });
    // 桌面牌跟随缩放，但补偿 left/top 让视觉中心不变 → 原地放大、不上下/左右乱动
    placedCards.forEach(p => {
      if (!p.isConnected) return;
      const r = p.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      p.style.transform = 'scale(' + fanScale + ')';
      const r2 = p.getBoundingClientRect();
      p.style.left = (parseFloat(p.style.left) - ((r2.left + r2.width / 2) - cx)) + 'px';
      p.style.top  = (parseFloat(p.style.top)  - ((r2.top  + r2.height / 2) - cy)) + 'px';
    });
  }
  function restoreFanTransitions() {
    fanCardEls.forEach(el => { el.style.transition = ''; });
  }

  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (isInteractiveTarget(e.target)) { _docZoom = null; return; }
    _docZoom = { sx: e.clientX, sy: e.clientY, start: fanScale, mode: null };
  });
  document.addEventListener('pointermove', (e) => {
    if (!_docZoom) return;
    const dx = e.clientX - _docZoom.sx;
    const dy = e.clientY - _docZoom.sy;
    if (!_docZoom.mode && Math.abs(dy) > 18 && Math.abs(dy) > Math.abs(dx)) {
      _docZoom.mode = 'zoom';
    }
    if (_docZoom.mode === 'zoom') {
      e.preventDefault();
      const delta = _docZoom.sy - e.clientY;   // 上滑 → 放大
      fanScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, _docZoom.start + delta * 0.002));
      applyFanScale();
    }
  }, { passive: false });
  function endDocZoom() {
    if (_docZoom && _docZoom.mode === 'zoom') restoreFanTransitions();
    _docZoom = null;
  }
  document.addEventListener('pointerup', endDocZoom);
  document.addEventListener('pointercancel', endDocZoom);
}

// ============================================================
//  记录功能：选区截图 + 记录页 + 持久化存储
// ============================================================
const drawerRec = document.getElementById('drawerRec');
const tabRec    = document.getElementById('tabRec');

tabRec.addEventListener('click', () => {
  drawerDeck.classList.remove('open');
  drawerRec.classList.toggle('open');
  renderRecords();
});

const recordBtn = document.getElementById('recordBtn');
const captureOverlay = document.getElementById('captureOverlay');
const captureRect    = document.getElementById('captureRect');
const captureTip     = document.getElementById('captureTip');
const captureConfirm = document.getElementById('captureConfirm');
const captureCancel  = document.getElementById('captureCancel');

const recordPage  = document.getElementById('recordPage');
const rpTitle     = document.getElementById('rpTitle');
const rpPhoto     = document.getElementById('rpPhoto');
const rpQuestion  = document.getElementById('rpQuestion');
const rpInterp    = document.getElementById('rpInterp');
const rpSave      = document.getElementById('rpSave');
const rpCancel    = document.getElementById('rpCancel');

const RECORDS_KEY = 'magiccat_records';
let _selStart = null;
let _captureDataUrl = null;   // 本次待保存的截图
let _viewingRecordId = null;  // 正在查看的记录 id（null=新建）

function loadRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; } catch (e) { return []; }
}
function persistRecords(records) {
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(records)); } catch (e) { alert('保存失败：存储空间不足'); }
}

// —— 记录按钮 → 打开选区截图 ——
recordBtn.addEventListener('click', () => {
  _captureDataUrl = null;
  captureRect.style.display = 'none';
  captureTip.textContent = '拖拽选择要保存的区域';
  captureConfirm.classList.remove('show');
  captureCancel.classList.remove('show');
  _selStart = null;
  captureOverlay.classList.add('active');
});

captureOverlay.addEventListener('pointerdown', (e) => {
  if (e.target !== captureOverlay) return;
  _selStart = { x: e.clientX, y: e.clientY };
  captureRect.style.display = 'block';
  captureRect.style.left = e.clientX + 'px';
  captureRect.style.top  = e.clientY + 'px';
  captureRect.style.width  = '0px';
  captureRect.style.height = '0px';
});
captureOverlay.addEventListener('pointermove', (e) => {
  if (!_selStart) return;
  const x = Math.min(_selStart.x, e.clientX);
  const y = Math.min(_selStart.y, e.clientY);
  const w = Math.abs(e.clientX - _selStart.x);
  const h = Math.abs(e.clientY - _selStart.y);
  captureRect.style.left = x + 'px';
  captureRect.style.top  = y + 'px';
  captureRect.style.width  = w + 'px';
  captureRect.style.height = h + 'px';
});
captureOverlay.addEventListener('pointerup', (e) => {
  if (!_selStart) return;
  _selStart = null;
  const r = captureRect.getBoundingClientRect();
  if (r.width < 20 || r.height < 20) {
    captureRect.style.display = 'none';
    return;
  }
  captureTip.textContent = '已选择区域，点下方保存';
  captureConfirm.classList.add('show');
  captureCancel.classList.add('show');
});

captureCancel.addEventListener('click', () => {
  captureOverlay.classList.remove('active');
  captureRect.style.display = 'none';
  captureConfirm.classList.remove('show');
  captureCancel.classList.remove('show');
});

captureConfirm.addEventListener('click', async () => {
  const r = captureRect.getBoundingClientRect();
  captureOverlay.style.display = 'none';   // 截图时隐藏选区工具
  try {
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#0d001a',
      scale: Math.min(window.devicePixelRatio || 2, 2),
      useCORS: true,
      logging: false,
    });
    const s = Math.min(window.devicePixelRatio || 2, 2);
    const sw = Math.max(1, Math.round(r.width * s));
    const sh = Math.max(1, Math.round(r.height * s));
    const sx = Math.max(0, Math.round(r.left * s));
    const sy = Math.max(0, Math.round(r.top * s));
    const crop = document.createElement('canvas');
    crop.width = sw; crop.height = sh;
    crop.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    // 压缩到最大宽 900，存 JPEG
    const maxW = 900;
    const sc = Math.min(1, maxW / crop.width);
    const cw = Math.round(crop.width * sc);
    const ch = Math.round(crop.height * sc);
    const small = document.createElement('canvas');
    small.width = cw; small.height = ch;
    small.getContext('2d').drawImage(crop, 0, 0, cw, ch);
    _captureDataUrl = small.toDataURL('image/jpeg', 0.85);
  } catch (err) {
    console.error('截图失败', err);
    _captureDataUrl = null;
  } finally {
    captureOverlay.style.display = '';
    captureOverlay.classList.remove('active');
    captureRect.style.display = 'none';
    captureConfirm.classList.remove('show');
    captureCancel.classList.remove('show');
  }
  if (_captureDataUrl) {
    openRecordPage(null);
  } else {
    captureTip.textContent = '截图失败，请重试';
    captureOverlay.classList.add('active');
  }
});

// —— 记录页 ——
function openRecordPage(record) {
  if (record) {
    _viewingRecordId = record.id;
    rpTitle.textContent = '✦ 记 录 详 情 ✦';
    rpPhoto.innerHTML = `<img src="${record.img}" alt="记录">`;
    rpQuestion.value = record.question || '';
    rpInterp.value = record.interp || '';
    rpSave.textContent = '更新';
  } else {
    _viewingRecordId = null;
    rpTitle.textContent = '✦ 新 记 录 ✦';
    rpPhoto.innerHTML = _captureDataUrl ? `<img src="${_captureDataUrl}" alt="截图">` : '';
    rpQuestion.value = '';
    rpInterp.value = '';
    rpSave.textContent = '保存';
  }
  recordPage.classList.add('active');
}

function closeRecordPage() {
  recordPage.classList.remove('active');
  _captureDataUrl = null;
  _viewingRecordId = null;
}

rpSave.addEventListener('click', () => {
  const question = rpQuestion.value.trim();
  const interp = rpInterp.value.trim();
  const records = loadRecords();
  if (_viewingRecordId) {
    const idx = records.findIndex(r => r.id === _viewingRecordId);
    if (idx >= 0) {
      records[idx].question = question;
      records[idx].interp = interp;
      records[idx].ts = Date.now();
    }
  } else {
    if (!_captureDataUrl) { alert('请先截图再保存'); return; }
    records.unshift({
      id: 'rec_' + Date.now(),
      img: _captureDataUrl,
      question, interp, ts: Date.now(),
    });
  }
  persistRecords(records);
  renderRecords();
  closeRecordPage();
});

rpCancel.addEventListener('click', closeRecordPage);

// —— 记录抽屉渲染 ——
function renderRecords() {
  const grid = document.getElementById('recGrid');
  const records = loadRecords();
  if (!records.length) {
    grid.innerHTML = '<div class="record-empty">暂无记录<br>点底部相机按钮截图并记录解读</div>';
    return;
  }
  grid.innerHTML = records.map(r => `
    <div class="record-item" data-id="${r.id}">
      <img src="${r.img}" alt="记录">
      <div class="ri-info">
        <div class="ri-q">${r.question || '（无问题）'}</div>
        <div class="ri-date">${new Date(r.ts).toLocaleString()}</div>
      </div>
      <button type="button" class="ri-delete" aria-label="删除这条记录" title="删除">✕</button>
    </div>
  `).join('');
  grid.querySelectorAll('.record-item').forEach(item => {
    const delBtn = item.querySelector('.ri-delete');
    if (delBtn) delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const rec = loadRecords().find(x => x.id === item.dataset.id);
      if (!rec) return;
      if (!confirm('确定删除这条记录？')) return;
      const records = loadRecords().filter(x => x.id !== item.dataset.id);
      persistRecords(records);
      renderRecords();
    });
    item.addEventListener('click', () => {
      const rec = loadRecords().find(x => x.id === item.dataset.id);
      if (rec) {
        drawerRec.classList.remove('open');
        openRecordPage(rec);
      }
    });
  });
}

// ============================================================
const ASTRO_HOUSES = Array.from({ length: 12 }, (_, index) => ({ symbol: String(index + 1), name: `第 ${index + 1} 宫` }));
const ASTRO_ZODIACS = [

function renderAstroValue(valueEl, value) {
  if (!value.icon) { valueEl.textContent = value.symbol; return; }
  valueEl.innerHTML = `<svg class="die-symbol-svg" data-symbol="${value.icon}" viewBox="0 0 48 48" aria-hidden="true">${ASTRO_ICON_PATHS[value.icon]}</svg>`;
}

const astroDiceToggle = document.getElementById('astroDiceToggle');
const astroDiceClose = document.getElementById('astroDiceClose');
const astroDicePanel = document.getElementById('astroDicePanel');
const astroDiceSets = [ASTRO_PLANETS, ASTRO_ZODIACS, ASTRO_HOUSES];
let astroDiceRolling = false;

// 视觉与投掷数据统一按：行星 → 星座 → 宫位。
const astroDiceRow = astroDicePanel.querySelector('.astro-dice-row');
['planet', 'zodiac', 'house'].forEach(kind => {
  const die = astroDiceRow.querySelector(`.astro-die[data-kind="${kind}"]`);
  if (die) astroDiceRow.appendChild(die.closest('.astro-die-wrap'));
});

// 中央五边形与五个侧面严格共边，避免切面重叠、断裂或悬空。
const D12_FACE_POINTS = {
  'die-face-1': '50,19 50,3 78,10 96,34 80,40',
  'die-face-2': '80,40 96,34 93,69 72,94 69,76',
  'die-face-3': '69,76 72,94 50,99 28,94 31,76',

  'die-face-center': '50,19 80,40 69,76 31,76 20,40',
  'die-center-inset': '50,27 72,43 64,68 36,68 28,43'
};
document.querySelectorAll('.astro-die').forEach(die => {
  Object.entries(D12_FACE_POINTS).forEach(([className, points]) => {
    die.querySelector(`.${className}`)?.setAttribute('points', points);
  });
  die.querySelector('.die-ridge-light')?.setAttribute('d', 'M20 40 50 19 80 40M22 10 50 3 78 10');
  die.querySelector('.die-ridge-dark')?.setAttribute('d', 'M80 40 69 76 31 76 20 40M28 94 50 99 72 94');
});

function setAstroDiceOnDesk(visible) {
  astroDicePanel.classList.toggle('open', visible);
  astroDicePanel.setAttribute('aria-hidden', String(!visible));
  astroDiceToggle.classList.toggle('active', visible);
  astroDiceToggle.title = visible ? '再次投掷占星骰子' : '投掷占星骰子';
  astroDiceToggle.setAttribute('aria-label', astroDiceToggle.title);
  astroDiceToggle.setAttribute('aria-expanded', String(visible));
  astroDiceClose.classList.toggle('visible', visible);
  astroDiceClose.setAttribute('aria-hidden', String(!visible));
  if (visible) [drawerDeck, drawerRec].forEach(drawer => drawer.classList.remove('open'));
}

function astroRandomIndex(length) {
  if (globalThis.crypto?.getRandomValues) {
    const value = new Uint32Array(1);
    globalThis.crypto.getRandomValues(value);
    return value[0] % length;
  }
  return Math.floor(Math.random() * length);
}

function animateAstroDie(die, values, finalValue, index) {
  return new Promise(resolve => {
    const throwX = [-310, -35, 300][index];
    const throwY = [105, -190, 85][index];
    const bounceX = [28, -18, -30][index];
    die.style.setProperty('--throw-x', `${throwX}px`);
    die.style.setProperty('--throw-y', `${throwY}px`);
    die.style.setProperty('--bounce-x', `${bounceX}px`);
    die.classList.remove('rolling');
    void die.offsetWidth;
    die.classList.add('rolling');
    const valueEl = die.querySelector('.die-value');
    const ticker = setInterval(() => {
      renderAstroValue(valueEl, values[astroRandomIndex(values.length)]);
    }, 65);
    setTimeout(() => {
      clearInterval(ticker);
      renderAstroValue(valueEl, finalValue);
      die.classList.remove('rolling');
      resolve();
    }, 920);
  });
}

async function rollAstroDice() {
  if (astroDiceRolling) return;
  astroDiceRolling = true;
  setAstroDiceOnDesk(true);
  const dice = [...astroDicePanel.querySelectorAll('.astro-die')];
  const results = astroDiceSets.map(values => values[astroRandomIndex(values.length)]);
  await Promise.all(dice.map((die, index) => animateAstroDie(die, astroDiceSets[index], results[index], index)));
  astroDiceRolling = false;
}

astroDiceToggle.addEventListener('click', rollAstroDice);
astroDiceClose.addEventListener('click', () => setAstroDiceOnDesk(false));
clearBtn.addEventListener('click', () => {
  if (!astroDiceRolling) setAstroDiceOnDesk(false);
});

const THEME_DEFAULT_DECK = { dopamine: '小小奇遇雷诺曼' };

function deckForTheme(theme) {
  const key = theme || document.body.dataset.theme || 'mystic';
  const deckName = THEME_DEFAULT_DECK[key];
  return deckName ? deckList.find(d => d.name === deckName) || null : null;
}

// 默认显示第一个牌组；当前配色若配了专属牌组则优先使用
let _bootTheme = 'mystic';
try { _bootTheme = localStorage.getItem('magiccat_reading_theme') || 'mystic'; } catch (_) {}
if (deckList.length > 0) {
  selectDeckAndOpen(deckList.find(d => d.id === 'theme-tarot-prototype') || deckForTheme(_bootTheme) || deckList[0]);
}

<script>
/* ============================================================
   页面配色：四套主题（与 web 黑猫占卜桌共用 key 与默认值）
   ============================================================ */
(function () {
  var THEME_KEY = 'magiccat_reading_theme';
  var THEMES = ['mystic', 'noir', 'parchment', 'dopamine'];
  var PAGE_BG = {
    mystic: '#0d001a',
    noir: '#f4f1eb',
    parchment: '#27170f',
    dopamine: '#f9eaf2'
  };
  var toggle = document.getElementById('themeToggle');
  var sheet = document.getElementById('themeSheet');
  var backdrop = document.getElementById('themeSheetBackdrop');
  var cards = [].slice.call(document.querySelectorAll('#themeSheet .ts-card'));
  var metaColor = document.querySelector('meta[name="theme-color"]');

  function applyReadingTheme(theme, persist) {
    var next = THEMES.indexOf(theme) >= 0 ? theme : 'mystic';
    if (next === 'mystic') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', next);
    /* iOS 橡皮筋区域 / 状态栏跟随主题 */
    document.documentElement.style.backgroundColor = PAGE_BG[next];
    if (metaColor) metaColor.setAttribute('content', PAGE_BG[next]);
    cards.forEach(function (card) {
      var active = card.getAttribute('data-theme') === next;
      card.classList.toggle('active', active);
      card.setAttribute('aria-pressed', String(active));
    });
    if (persist !== false) {
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    }
  }

  function openSheet() {
    sheet.classList.add('open');
    backdrop.classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');
  }
  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }

  toggle.addEventListener('click', function () {
    if (sheet.classList.contains('open')) closeSheet(); else openSheet();
  });
  backdrop.addEventListener('click', closeSheet);
  /* 选中配色后面板保持打开，方便连续对比；点空白或再次点按钮收起 */
  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      applyReadingTheme(card.getAttribute('data-theme'));
      /* 该配色若配了专属牌组（雾糖奇遇 → 小小奇遇雷诺曼），跟着换过去 */
      try {
        var deck = typeof deckForTheme === 'function' ? deckForTheme(card.getAttribute('data-theme')) : null;
        if (!(currentDeck && currentDeck._themeTarot) && deck && typeof selectDeckAndOpen === 'function') selectDeckAndOpen(deck);
      } catch (e) {}
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
  });

  var saved = 'mystic';
  try { saved = localStorage.getItem(THEME_KEY) || 'mystic'; } catch (e) {}
  applyReadingTheme(saved, false);
})();
</script>
