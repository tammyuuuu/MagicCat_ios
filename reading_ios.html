<script>
// ============================================================
//  1. 抽屉开关
// ============================================================
const drawerDeck = document.getElementById('drawerDeck');
const tabDeck    = document.getElementById('tabDeck');

tabDeck.addEventListener('click', () => {
  document.getElementById('drawerRec')?.classList.remove('open');
  drawerDeck.classList.toggle('open');
});
// 点击桌面空白关闭抽屉
document.getElementById('desktop').addEventListener('click', (e) => {
  if (e.target === desktop || e.target === dragLayer) {
    drawerDeck.classList.remove('open');
    document.getElementById('drawerRec')?.classList.remove('open');
  }
});

// ============================================================
//  2. 桌面元素引用
// ============================================================
const desktop  = document.getElementById('desktop');
const dragLayer = document.getElementById('dragLayer');

// ============================================================
//  4. 牌组系统（使用 decks.js 的 DECKS，加载真实牌图）
// ============================================================
let deckList = [];
let currentDeck = [];
let drawnIds = new Set();
let placedCards = [];
let présSelectedIdx = -1;

function loadDecksFromConfig() {
  if (typeof DECKS === 'undefined' || !Array.isArray(DECKS)) return;
  DECKS.forEach((cfg, idx) => {
    const basePath = cfg.path.replace(/\/+$/, '');
    const count = cfg.cardCount || 78;
    const fmt = cfg.format || 'png';
    const startAt = cfg.startAt || 0;   // 图片文件起始编号（雷诺曼等为 1）
    const deckId = `config-deck-${idx}`;
    const backFmt = cfg.back || 'png';
    const backPath = basePath + '/back.' + backFmt;
    const cards = [];
    for (let i = 0; i < count; i++) {
      cards.push({
        id: `${deckId}-${i}`, number: String(i + 1),
        name: cfg.name + ' #' + i, type: 'custom',
        _imgUrl: basePath + '/' + (startAt + i) + '.' + fmt,
      });
    }
    deckList.push({
      id: deckId, name: cfg.name, count, icon: '🃏',
      _backImg: backPath, _cards: cards,
      noReverse: cfg.noReverse || false,
      layout: cfg.layout || 'portrait',
      aspectRatio: cfg.aspectRatio || 2 / 3,
    });
  });
}
loadDecksFromConfig();

function renderDecks() {
  const grid = document.getElementById('deckGrid');
  if (!deckList.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px 0;color:#5a3a7a;font-size:12px;">请配置 decks.js</div>';
    return;
  }
  grid.innerHTML = deckList.map(d => {
    const thumb = d._backImg;
    return `
    <div class="drawer-item" data-deck-id="${d.id}">
      ${thumb
        ? `<img src="${thumb}" alt="" style="max-width:50px;max-height:70px;width:auto;height:auto;border:2px solid #4a2a6a;display:block;" draggable="false" onerror="this.outerHTML='<span style=font-size:24px;>🃏</span>'">`
        : '<span style="font-size:24px;">🃏</span>'
      }
      <span class="gem-label">${d.name}</span>
      <span style="font-size:8px;color:#5a3a7a;">${d.count}张</span>
    </div>`;
  }).join('');

  grid.querySelectorAll('.drawer-item').forEach(item => {
    item.addEventListener('click', () => {
      const did = item.dataset.deckId;
      const deck = deckList.find(d => d.id === did);
      if (deck) selectDeckAndOpen(deck);
      drawerDeck.classList.remove('open');
    });
  });
}
renderDecks();

function selectDeckAndOpen(deck) {
  closeFan();
  if (deck._cards) {
    currentDeck = [...deck._cards];
  } else {
    currentDeck = Array.from({length: deck.count}, (_, i) => ({
      id: `${deck.id}-${i}`, number: String(i + 1),
      name: `#${i+1}`, type: 'custom',
    }));
  }
  if (deck._backImg) {
    currentDeck._images = { back: deck._backImg, fronts: deck._frontImgs || [], noReverse: deck.noReverse || false, layout: deck.layout || 'portrait', aspectRatio: deck.aspectRatio || 2 / 3 };
  }
  openFan();
}

// ============================================================
//  5. 塔罗扇形 + 抽牌翻牌拖拽
// ============================================================
const fanArea      = document.getElementById('fanArea');
const fanScroll    = document.getElementById('fanScroll');
const fanControls  = document.getElementById('fanControls');
const clearBtn     = document.getElementById('clearBtn');
const arrowLeft    = document.getElementById('fanArrowLeft');
const arrowRight   = document.getElementById('fanArrowRight');

let rotationOffset   = 0;
let fanCardEls       = [];
let fanScale         = 1;      // 扇形牌缩放：上滑放大 / 下滑缩小（0.6 ~ 1.8）
let _suppressClick   = false;   // 触控手势后抑制重复 click
const IS_MOBILE      = window.innerWidth <= 768;
const CARD_STEP      = IS_MOBILE ? 5.5 : 4.3; // 手机端角度更小，扇形更紧凑、牌更多
const WINDOW_HALF    = IS_MOBILE ? 5 : 6;     // 手机端显示更多牌

// --- 禁止手势缩放/改大小（双击、双指缩放），不影响单指滚动 ---
if (IS_MOBILE) {
  document.addEventListener('gesturestart',  e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend',    e => e.preventDefault());
  document.addEventListener('dblclick',      e => e.preventDefault());
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
}

// --- 禁原生拖拽(Drag&Drop)与长按上下文菜单（桌面端右键移除功能不受影响） ---
document.addEventListener('dragstart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

// --- Fisher-Yates 洗牌 + 随机正逆位 ---
function shuffleDeck(deck) {
  const arr = [...deck];
  const images = deck._images;
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  const noRev = currentDeck._images?.noReverse;
  const result = arr.map(card => ({ ...card, isReversed: noRev ? false : Math.random() < 0.5 }));
  result._images = images;
  return result;
}

// --- 洗牌按钮：重洗整副牌（对齐 web 动画） ---
const shuffleBtn = document.getElementById('shuffleBtn');
let isShuffling = false;

function waitForShufflePhase(duration) {
  return new Promise(resolve => setTimeout(resolve, duration));
}

async function animateShuffle() {
  if (isShuffling || !currentDeck.length || !fanArea.classList.contains('active')) return;
  isShuffling = true;
  shuffleBtn.classList.add('shuffling');
  shuffleBtn.setAttribute('aria-busy', 'true');
  fanArea.classList.add('shuffling');
  fanControls.querySelectorAll('button').forEach(button => button.classList.add('interaction-locked'));
  présSelectedIdx = -1;

  const centerX = (fanScroll.offsetWidth || window.innerWidth) / 2;
  const centerY = (fanScroll.offsetHeight || 220) - 44;
  fanCardEls.forEach((el, order) => {
    el.classList.remove('preselected');
    el.style.transition = 'transform 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease';
    el.style.zIndex = 80 + order;
    el.style.transform = `translate(calc(${centerX}px - 50%), ${centerY}px) rotate(${(order % 2 ? 1 : -1) * 4}deg) scale(0.92)`;
    el.style.opacity = '1';
    el.style.pointerEvents = 'none';
  });

  await waitForShufflePhase(520);

  fanCardEls.forEach((el, order) => {
    const direction = order % 2 ? 1 : -1;
    el.style.transition = 'transform 0.17s ease-in-out';
    el.style.transform = `translate(calc(${centerX + direction * 30}px - 50%), ${centerY + (order % 3) * 2}px) rotate(${direction * 7}deg) scale(0.94)`;
  });
  await waitForShufflePhase(180);
  fanCardEls.forEach((el, order) => {
    const direction = order % 2 ? -1 : 1;
    el.style.transform = `translate(calc(${centerX + direction * 28}px - 50%), ${centerY}px) rotate(${direction * 6}deg) scale(0.94)`;
  });
  await waitForShufflePhase(180);

  currentDeck = shuffleDeck(currentDeck);
  placedCards.forEach(placed => {
    placed.dataset.globalIdx = currentDeck.findIndex(card => card.id === placed.dataset.cardId);
  });
  rotationOffset = 0;
  fanCardEls.forEach(el => el.remove());
  fanCardEls = [];
  _enterFromLeft = true;
  renderFanWindow();

  await waitForShufflePhase(650);
  fanArea.classList.remove('shuffling');
  shuffleBtn.classList.remove('shuffling');
  shuffleBtn.removeAttribute('aria-busy');
  fanControls.querySelectorAll('button').forEach(button => button.classList.remove('interaction-locked'));
  isShuffling = false;
}

shuffleBtn.addEventListener('click', animateShuffle);

function openFan() {
  closeFan();
  fanArea.classList.add('active');
  fanControls.classList.add('active');
  currentDeck = shuffleDeck(currentDeck);
  rotationOffset = 0;
  fanScale = 1;
  placedCards.forEach(p => { if (p.isConnected) p.style.transform = 'scale(1)'; });
  présSelectedIdx = -1;
  _enterFromLeft = true;
  renderFanWindow();
}

function closeFan() {
  fanArea.classList.remove('active');
  fanControls.classList.remove('active');
  fanCardEls.forEach(el => el.remove());
  fanCardEls = [];
  présSelectedIdx = -1;
  drawnIds.clear();
}

// --- 扇形几何 ---
function getFanLayout(idx) {
  const total = currentDeck.length;
  const centerIdx = total / 2 + rotationOffset;
  const rel = idx - centerIdx;
  const angleDeg = rel * CARD_STEP;
  const fanW = fanScroll.offsetWidth || window.innerWidth || 800;
  const fanH = fanScroll.offsetHeight || 220;
  // 手机端：半径随屏宽缩放，让扇形在手机上更紧凑、牌更多
  const radius = IS_MOBILE ? Math.min(380, Math.max(280, fanW * 0.9)) : 1600;
  const cx = fanW / 2;
  const cy = fanH + radius - (IS_MOBILE ? fanH * 0.75 : 200);
  const rad = angleDeg * Math.PI / 180;
  return {
    x: cx + radius * Math.sin(rad),
    y: cy - radius * Math.cos(rad),
    rotation: angleDeg,
    z: Math.floor(rel) + 50,
    opacity: Math.abs(rel) <= WINDOW_HALF ? 1 : 0,
  };
}

// --- 创建一张扇形牌 DOM（seqNum 为从左到右的序号，不暴露真实牌号） ---
function createFanCardEl(globalIdx, seqNum) {
  const card = currentDeck[globalIdx];
  if (!card || drawnIds.has(card.id)) return null;
  const backImg = currentDeck._images?.back;
  const el = document.createElement('div');
  el.className = 'fan-card';
  if (currentDeck._images?.layout === 'landscape') el.classList.add('landscape');
  el.dataset.globalIdx = globalIdx;
  el.dataset.reversed = card.isReversed ? 'true' : 'false';
  el.innerHTML = backImg
    ? `<div class="card-inner" style="padding:0;overflow:hidden;background:transparent;">
        <img src="${backImg}" alt="" draggable="false" style="display:block;width:100%;height:auto;"
             onerror="this.style.display='none';this.parentElement.style.cssText+=';width:80px;height:120px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1a0a30,#0c0218);'">
        <span class="card-number">${seqNum || ''}</span>
       </div>`
    : `<div class="card-inner">
        <span class="card-number">${seqNum || ''}</span>
       </div>`;
  el.addEventListener('click', (e) => {
    if (IS_MOBILE) return;   // 手机端由 pointer 事件处理，避免重复切换选中
    if (_suppressClick) return;
    e.stopPropagation();
    handleFanCardClick(globalIdx);
  });
  el.addEventListener('mousedown', (e) => {
    if (IS_MOBILE) return;        // 手机端由触控处理选中与拖出
    if (e.button !== 0) return;
    if (présSelectedIdx !== globalIdx) return;
    e.preventDefault();
    startFanCardDrag(e, globalIdx);
  });
  return el;
}

// --- 渲染可见窗口 ---
let _enterFromLeft = false;

function renderFanWindow() {
  const total = currentDeck.length;
  const centerIdx = total / 2 + rotationOffset;
  const lo = Math.max(0, Math.floor(centerIdx - WINDOW_HALF));
  const hi = Math.min(total - 1, Math.ceil(centerIdx + WINDOW_HALF));
  const needIndices = new Set();
  for (let i = lo; i <= hi; i++) {
    if (!drawnIds.has(currentDeck[i]?.id)) needIndices.add(i);
  }

  const remaining = total - drawnIds.size;
  arrowLeft.style.visibility  = lo > 0 ? 'visible' : 'hidden';
  arrowRight.style.visibility = hi < total - 1 ? 'visible' : 'hidden';

  if (présSelectedIdx >= 0 && !needIndices.has(présSelectedIdx)) présSelectedIdx = -1;

  // 移出窗口
  fanCardEls = fanCardEls.filter(el => {
    const idx = parseInt(el.dataset.globalIdx);
    if (!needIndices.has(idx)) {
      const layout = getFanLayout(idx);
      el.style.opacity = '0';
      el.style.transform = `translate(calc(${layout.x}px - 50%), ${layout.y}px) rotate(${layout.rotation}deg) scale(0.6)`;
      setTimeout(() => el.remove(), 600);
      return false;
    }
    return true;
  });

  // 新进入（编号 = 牌在牌堆中的实际位置）
  needIndices.forEach(idx => {
    if (fanCardEls.some(el => parseInt(el.dataset.globalIdx) === idx)) return;
    const el = createFanCardEl(idx, idx + 1);
    if (!el) return;
    const layout = getFanLayout(idx);
    const side = _enterFromLeft ? -1 : 1;
    const startX = side * (fanScroll.offsetWidth * 1.2);
    const startY = (fanScroll.offsetHeight || 220) + 90;
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = `translate(${startX}px, ${startY}px) rotate(${side * 30}deg) scale(0.6)`;
    el.style.zIndex = 0;
    el.style.pointerEvents = 'none';
    fanScroll.appendChild(el);
    fanCardEls.push(el);
    requestAnimationFrame(() => {
      el.style.transition = '';
      applyCardPosition(el, idx);
    });
  });

  // 已有牌更新位置 + 更新编号（基于牌堆位置）
  fanCardEls.forEach(el => {
    const idx = parseInt(el.dataset.globalIdx);
    el.style.transition = '';
    applyCardPosition(el, idx);
    const sn = el.querySelector('.card-number');
    if (sn) sn.textContent = idx + 1;
  });
}

function applyCardPosition(el, idx) {
  const card = currentDeck[idx];
  if (card && drawnIds.has(card.id)) {
    el.remove();
    fanCardEls = fanCardEls.filter(e => e !== el);
    return;
  }
  const layout = getFanLayout(idx);
  const isVisible = layout.opacity === 1;
  el.style.transform = `translate(calc(${layout.x}px - 50%), ${layout.y}px) rotate(${layout.rotation}deg) scale(${fanScale})`;
  el.style.opacity = isVisible ? '1' : '0';
  el.style.zIndex = isVisible ? layout.z : 0;
  el.style.pointerEvents = isVisible ? '' : 'none';
}

// --- 单击预选 ---
function handleFanCardClick(globalIdx) {
  if (présSelectedIdx === globalIdx) {
    présSelectedIdx = -1;
  } else {
    if (présSelectedIdx >= 0) {
      const oldEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === présSelectedIdx);
      if (oldEl) oldEl.classList.remove('preselected');
    }
    présSelectedIdx = globalIdx;
  }
  fanCardEls.forEach(el => {
    const idx = parseInt(el.dataset.globalIdx);
    el.classList.toggle('preselected', idx === présSelectedIdx);
  });
}

// --- 预选后拖拽放置（物理移动原牌） ---
function startFanCardDrag(e, globalIdx) {
  const card = currentDeck[globalIdx];
  if (!card) return;
  const srcEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === globalIdx);
  if (!srcEl) return;
  // 记录扇形中当前尺寸（已含 fanScale 缩放），拖拽中保持与扇形一致
  const layW = srcEl.offsetWidth, layH = srcEl.offsetHeight;   // 布局尺寸（含图片真实比例）
  const srcRect = srcEl.getBoundingClientRect();   // 视觉初始位置（含扇形排布）
  const cw = layW * fanScale, ch = layH * fanScale;   // 拖拽视觉尺寸（未旋转，用于放手定位）
  const startLeft = srcRect.left;
  const startTop  = srcRect.top;

  fanScroll.style.pointerEvents = 'none';
  srcEl.remove();
  fanCardEls = fanCardEls.filter(el => el !== srcEl);
  srcEl.classList.remove('preselected');
  srcEl.style.transformOrigin = '50% 50%';
  srcEl.style.position = 'fixed';
  srcEl.style.left = startLeft + 'px';
  srcEl.style.top  = startTop + 'px';
  srcEl.style.zIndex = '9999';
  srcEl.style.pointerEvents = 'none';
  srcEl.style.transition = 'none';
  srcEl.style.transform = 'rotate(-5deg) scale(' + fanScale + ')';   // 保留扇形缩放，大小与扇形一致
  const inner = srcEl.querySelector('.card-inner');
  if (inner) {
    const isNoir = document.body.dataset.theme === 'noir';
    inner.style.boxShadow = isNoir ? '0 8px 24px rgba(0,0,0,.28)' : '0 8px 32px rgba(180,100,255,0.4)';
    inner.style.borderColor = isNoir ? '#17171a' : '#b080ff';
  }
  document.body.appendChild(srcEl);

  const offsetX = e.clientX - startLeft;
  const offsetY = e.clientY - startTop;

  function onMove(ev) {
    srcEl.style.left = (ev.clientX - offsetX) + 'px';
    srcEl.style.top  = (ev.clientY - offsetY) + 'px';
  }
  function onUp(ev) {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    fanScroll.style.pointerEvents = '';
    srcEl.remove();
    let relX = ev.clientX - cw / 2;
    let relY = ev.clientY - ch / 2;
    relX = Math.max(0, Math.min(relX, window.innerWidth - cw));
    relY = Math.max(60, Math.min(relY, window.innerHeight - ch));
    placeCardAt(card, globalIdx, relX, relY, layW, layH);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  srcEl.style.left = (e.clientX - offsetX) + 'px';
  srcEl.style.top  = (e.clientY - offsetY) + 'px';
}

// --- 放置牌到桌面 ---
function placeCardAt(card, globalIdx, posX, posY, sizeW, sizeH) {
  const fanEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === globalIdx);
  const isRev = fanEl?.dataset.reversed === 'true' || card.isReversed || false;
  if (fanEl) { fanEl.remove(); fanCardEls = fanCardEls.filter(el => el !== fanEl); }
  drawnIds.add(card.id);

  placeCardWithFlip(card, globalIdx, posX, posY, isRev, sizeW, sizeH);
  if (présSelectedIdx === globalIdx) présSelectedIdx = -1;
}

// --- 创建桌面放置牌（3D 翻牌） ---
function placeCardWithFlip(card, globalIdx, posX, posY, isReversed, sizeW, sizeH) {
  // 布局尺寸：优先用拖拽源的实测尺寸（含图片真实比例），否则按横/竖版自适应
  const isLandscape = currentDeck._images?.layout === 'landscape';
  const cardAspectRatio = currentDeck._images?.aspectRatio || (isLandscape ? 3 / 2 : 2 / 3);
  const refW = sizeW || (IS_MOBILE
    ? Math.round(Math.min(window.innerWidth * (isLandscape ? 0.38 : 0.18), isLandscape ? 180 : 84))
    : Math.round(window.innerWidth * (isLandscape ? 0.18 : 0.1)));
  const refH = sizeH || Math.round(refW / cardAspectRatio);
  const baseX = posX !== undefined ? posX : (window.innerWidth - refW) / 2 + (Math.random() - 0.5) * refW * 0.6;
  const baseY = posY !== undefined ? posY : (window.innerHeight - refH) / 2 + (Math.random() - 0.5) * refH * 0.6;
  const s = fanScale;
  const vw = refW * s, vh = refH * s;   // 视觉尺寸（含当前缩放）
  // posX/posY 为视觉左上角（拖拽放手时已按视觉尺寸 clamp）；未传则按视觉尺寸居中

  const backImg  = currentDeck._images?.back;
  const frontImg = card._imgUrl;

  const placed = document.createElement('div');
  placed.className = 'placed-card';
  if (isLandscape) placed.classList.add('landscape');
  placed.dataset.cardId = card.id;
  placed.dataset.globalIdx = globalIdx;
  // 视觉左上角 clamp 后换算成布局坐标（牌 transform-origin 为中心，scale=s）
  const vLeft = Math.max(0, Math.min(baseX, Math.max(0, window.innerWidth - vw)));
  const vTop  = Math.max(0, Math.min(baseY, Math.max(0, window.innerHeight - vh)));
  placed.style.left = (vLeft - (1 - s) * refW / 2) + 'px';
  placed.style.top  = (vTop  - (1 - s) * refH / 2) + 'px';
  placed.style.transform = 'scale(' + fanScale + ')';   // 放置后跟随扇形缩放，大小一致

  placed.innerHTML = `
    <div class="card-flipper">
      <div class="card-back">
        ${backImg
          ? `<img src="${backImg}" alt="" draggable="false" onerror="this.outerHTML='<div style=display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:2/3;background:radial-gradient(circle,#1a0a30,#0c0218);><span style=font-size:36px;color:rgba(180,100,255,0.15);>✦</span></div>'">`
          : ''}
      </div>
      <div class="card-front${isReversed ? ' is-reversed' : ''}">
        ${frontImg
          ? `<img src="${frontImg}" alt="${card.name}" draggable="false" onerror="this.outerHTML='<div style=display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;aspect-ratio:2/3;background:linear-gradient(160deg,#1a0a30,#0c0218);padding:8px;><span>${card.number}</span><span style=font-size:1.5em;>🌟</span><span>${card.name}</span></div>'">`
          : `<div style="width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1a0a30,#0c0218);padding:8px;">
              <span style="font-size:inherit;color:#7a4a9a;">${card.number}</span>
              <span style="font-size:1.5em;margin:4px 0;">🌟</span>
              <span style="font-size:0.7em;color:#b898e0;text-align:center;">${card.name}</span>
             </div>`
        }
      </div>
    </div>
    ${IS_MOBILE ? '' : '<span class="card-remove-hint">右键移除</span>'}
  `;

  // 从桌面移除一张牌（右键/长按），并放回扇形
  const removePlacedCard = (el) => {
    if (drawnIds.has(card.id)) {
      drawnIds.delete(card.id);
      const newFanEl = createFanCardEl(globalIdx, globalIdx + 1);
      if (newFanEl) {
        newFanEl.style.transition = 'none';
        newFanEl.style.left = 'calc(50% + 300px)';
        newFanEl.style.transform = 'rotate(25deg)';
        newFanEl.style.opacity = '0';
        newFanEl.style.zIndex = 0;
        fanScroll.appendChild(newFanEl);
        fanCardEls.push(newFanEl);
        requestAnimationFrame(() => {
          newFanEl.style.transition = '';
          applyCardPosition(newFanEl, globalIdx);
        });
      }
    }
    el.remove();
    placedCards = placedCards.filter(p => p !== el);
  };

  if (IS_MOBILE) {
    // ===== 手机端：轻点翻牌 / 拖动移动 / 长按移除（Pointer Events 兼容鼠标+触摸） =====
    let tOffX = 0, tOffY = 0, lastX = 0, lastY = 0, tDragging = false, tDist = 0, lpTimer = null;

    placed.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const r = placed.getBoundingClientRect();
      tOffX = e.clientX - r.left; tOffY = e.clientY - r.top;
      lastX = e.clientX; lastY = e.clientY;
      tDragging = true; tDist = 0;
      placed.style.zIndex = 300;
      placed.style.cursor = 'grabbing';
      try { placed.setPointerCapture(e.pointerId); } catch (_) {}
      lpTimer = setTimeout(() => {          // 长按 600ms 移除
        removePlacedCard(placed);
        tDragging = false;
      }, 600);
    });

    placed.addEventListener('pointermove', (e) => {
      if (!tDragging) return;
      tDist += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
      lastX = e.clientX; lastY = e.clientY;
      // 视觉坐标 clamp（用视觉尺寸）后再换算成布局坐标（牌 transform-origin 为中心，scale=s）
      const s = fanScale;
      const w = placed.offsetWidth, h = placed.offsetHeight;
      const vw = w * s, vh = h * s;   // 视觉尺寸
      let vLeft = e.clientX - tOffX;
      let vTop  = e.clientY - tOffY;
      vLeft = Math.max(0, Math.min(vLeft, window.innerWidth - vw));
      vTop  = Math.max(0, Math.min(vTop, window.innerHeight - vh));
      placed.style.left = (vLeft - (1 - s) * w / 2) + 'px';
      placed.style.top  = (vTop  - (1 - s) * h / 2) + 'px';
      if (tDist > 8 && lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      e.preventDefault();
    }, { passive: false });

    placed.addEventListener('pointerup', () => {
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      tDragging = false;
      placed.style.zIndex = '';      // 拖完恢复 CSS 层级，避免盖住抽屉/按钮
      placed.style.cursor = 'grab';
      if (tDist <= 8) {
        if (placed.classList.contains('revealed')) {
          openCardZoom(placed, card.name);        // 已翻面 → 轻点放大
        } else {
          placed.classList.toggle('revealed');    // 未翻面 → 轻点翻面
        }
      }
    });

    placed.addEventListener('pointercancel', () => {
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      tDragging = false;
      placed.style.zIndex = '';
    });
  } else {
    // ===== 桌面端：鼠标拖拽 + 右键移除 =====
    let dragDist = 0, offX = 0, offY = 0, _mousedown = false;

    placed.addEventListener('click', (e) => {
      if (dragDist > 5) return;
      placed.classList.toggle('revealed');
    });

    placed.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      _mousedown = true;
      dragDist = 0;
      const r = placed.getBoundingClientRect();
      offX = e.clientX - r.left; offY = e.clientY - r.top;
      placed.style.zIndex = 300;
      placed.style.cursor = 'grabbing';
      e.preventDefault();
    });

    const onMove = (e) => {
      if (!_mousedown) return;
      dragDist += Math.abs(e.movementX) + Math.abs(e.movementY);
      // 视觉坐标 clamp（用视觉尺寸）后再换算成布局坐标
      const s = fanScale;
      const w = placed.offsetWidth, h = placed.offsetHeight;
      const vw = w * s, vh = h * s;
      let vLeft = e.clientX - offX;
      let vTop  = e.clientY - offY;
      vLeft = Math.max(0, Math.min(vLeft, window.innerWidth - vw));
      vTop  = Math.max(0, Math.min(vTop, window.innerHeight - vh));
      placed.style.left = (vLeft - (1 - s) * w / 2) + 'px';
      placed.style.top  = (vTop  - (1 - s) * h / 2) + 'px';
    };
    const onUp = () => { if (_mousedown) { _mousedown = false; placed.style.zIndex = ''; placed.style.cursor = 'grab'; } };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);

    placed.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      removePlacedCard(placed);
    });
  }

  // 与扇形同比例缩放（上滑放大/下滑缩小保持一致）
  // 缩放围绕牌自身中心，位置由 applyFanScale 补偿保持“原地放大”
  placed.style.transformOrigin = '50% 50%';
  placed.style.transform = 'scale(' + fanScale + ')';

  // 挂到 body 顶层：避免被 #desktop(z-index:1) 层叠上下文困住，盖在扇形区之下
  document.body.appendChild(placed);
  placedCards.push(placed);
}

});

});

// ============================================================
//  清空桌面（仿 web：牌飞回扇形，水晶/蜡烛移除）
// ============================================================
function returnCardToFan(placed) {
  const cardId = placed.dataset.cardId;
  const globalIdx = parseInt(placed.dataset.globalIdx);
  if (!cardId || !drawnIds.has(cardId)) return;
  drawnIds.delete(cardId);
  const newFanEl = createFanCardEl(globalIdx, globalIdx + 1);
  if (newFanEl) {
    // 初始在视野外（右侧飞入），由 applyCardPosition 接管最终定位
    newFanEl.style.transition = 'none';
    newFanEl.style.left = '0';
    newFanEl.style.top  = '0';
    newFanEl.style.opacity = '0';
    newFanEl.style.transform = `translate(${fanScroll.offsetWidth * 1.2}px, 40px) rotate(25deg) scale(0.6)`;
    newFanEl.style.zIndex = 0;
    newFanEl.style.pointerEvents = 'none';
    fanScroll.appendChild(newFanEl);
    fanCardEls.push(newFanEl);
    requestAnimationFrame(() => {
      newFanEl.style.transition = '';
      applyCardPosition(newFanEl, globalIdx);
    });
  }
}

function clearDesktop() {
  // 桌面上的牌 → 放回扇形区
  placedCards.forEach(placed => {
    returnCardToFan(placed);
    placed.remove();
  });
  placedCards = [];

  // 清空扇形选中状态
  présSelectedIdx = -1;
  fanCardEls.forEach(el => el.classList.remove('preselected'));
}

clearBtn.addEventListener('click', () => {
  clearBtn.classList.remove('purging');
  void clearBtn.offsetWidth;
  clearBtn.classList.add('purging');
  clearDesktop();
});

// ============================================================
//  牌面放大查看（手机：单点桌面牌放大；可翻面/解读）
// ============================================================
const cardZoom  = document.getElementById('cardZoom');
const zoomCard  = document.getElementById('zoomCard');
const zoomClose = document.getElementById('zoomClose');
const zoomFlip  = document.getElementById('zoomFlip');
const zoomInterpret = document.getElementById('zoomInterpret');

let _zoomPlaced = null;      // 当前放大的桌面牌
let _zoomFrontSrc = null;    // 牌正面图
let _zoomBackSrc  = null;    // 牌背面图
let _zoomCardName = '';
let _zoomInterpSrc = null;   // 解读图路径
let _zoomShowingInterp = false;

function openCardZoom(placed, name) {
  const isRevealed = placed.classList.contains('revealed');
  const frontSrc = placed.querySelector('.card-front img')?.src || null;
  const backSrc  = placed.querySelector('.card-back img')?.src || null;
  let src = isRevealed ? frontSrc : backSrc;
  if (!src) src = isRevealed ? backSrc : frontSrc;

  _zoomPlaced = placed;
  _zoomFrontSrc = frontSrc;
  _zoomBackSrc  = backSrc;
  _zoomCardName = name;
  _zoomShowingInterp = false;

  // 推导解读图路径：1.png → 1_.png
  const cardId = placed.dataset.cardId;
  const card = currentDeck.find(c => c.id === cardId);
  _zoomInterpSrc = card?._imgUrl
    ? String(card._imgUrl).replace(/(\d+)\.(\w+)$/, '$1_.$2')
    : null;

  zoomInterpret.classList.remove('back');
  zoomInterpret.textContent = '解读';
  // 先隐藏解读按钮，确认解读图真实存在后再显示（避免 404 破图）
  zoomInterpret.style.display = 'none';
  if (_zoomInterpSrc) {
    const probe = new Image();
    probe.onload = () => { zoomInterpret.style.display = 'flex'; };
    probe.src = _zoomInterpSrc;
  }

  if (src) {
    zoomCard.innerHTML = `<img src="${src}" alt="${name}" draggable="false">`;
  } else {
    zoomCard.innerHTML = `<div style="width:60vw;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1a0a30,#0c0218);font-size:18px;color:#c9a0ff;border:3px solid #6b3fa0;">${name}</div>`;
  }
  cardZoom.classList.add('active');
}

// 翻面：切换桌面牌正反面并同步放大视图
zoomFlip.addEventListener('click', () => {
  if (!_zoomPlaced) return;
  _zoomPlaced.classList.toggle('revealed');
  _zoomShowingInterp = false;
  zoomCard.classList.remove('interp');
  zoomInterpret.classList.remove('back');
  zoomInterpret.textContent = '解读';
  const isRevealed = _zoomPlaced.classList.contains('revealed');
  const src = isRevealed ? _zoomFrontSrc : _zoomBackSrc;
  if (src) zoomCard.innerHTML = `<img src="${src}" alt="${_zoomCardName}" draggable="false">`;
});

// 解读按钮：切换 牌面 ↔ 解读图
zoomInterpret.addEventListener('click', () => {
  if (!_zoomInterpSrc) return;
  _zoomShowingInterp = !_zoomShowingInterp;
  if (_zoomShowingInterp) {
    zoomCard.innerHTML = `<img src="${_zoomInterpSrc}" alt="${_zoomCardName} 解读" draggable="false">`;
    zoomCard.classList.add('interp');
    zoomInterpret.classList.add('back');
    zoomInterpret.textContent = '返回牌面';
  } else {
    const src = _zoomBackSrc && !_zoomFrontSrc ? _zoomBackSrc : _zoomFrontSrc || _zoomBackSrc;
    zoomCard.innerHTML = `<img src="${src}" alt="${_zoomCardName}" draggable="false">`;
    zoomCard.classList.remove('interp');
    zoomInterpret.classList.remove('back');
    zoomInterpret.textContent = '解读';
  }
});

function closeCardZoom() {
  cardZoom.classList.remove('active');
  zoomCard.classList.remove('interp');
  zoomInterpret.classList.remove('back');
  zoomInterpret.textContent = '解读';
  _zoomShowingInterp = false;
  _zoomPlaced = null;
  _zoomFrontSrc = _zoomBackSrc = _zoomInterpSrc = null;
}

// 点击背景或关闭按钮退出
cardZoom.addEventListener('click', (e) => {
  if (e.target === cardZoom || e.target === zoomClose) closeCardZoom();

document.addEventListener('keydown', (e) => {

// ============================================================
//  手机触控：左右滑动翻页 / 单点凸出选中 / 直接拖动
// ============================================================
if (IS_MOBILE) {
  const SWIPE_STEP = 3;          // 一次滑动翻几张
  let _fanTouch = null;          // 当前触控状态

  // 手机端选中（单点凸出）：点其他牌自动切换，不再同牌取消
  function selectFanCardMobile(gi) {
    if (présSelectedIdx >= 0 && présSelectedIdx !== gi) {
      const oldEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === présSelectedIdx);
      if (oldEl) oldEl.classList.remove('preselected');
    }
    présSelectedIdx = gi;
    fanCardEls.forEach(el => el.classList.toggle('preselected', parseInt(el.dataset.globalIdx) === gi));
  }
  // 手机端取消：单击空白区域
  function deselectFanCardMobile() {
    if (présSelectedIdx < 0) return;
    const oldEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === présSelectedIdx);
    if (oldEl) oldEl.classList.remove('preselected');
    présSelectedIdx = -1;
  }

  // 翻页（dir: -1 左滑看上一批，+1 右滑看下一批）
  function fanStep(dir) {
    const total = currentDeck.length;
    const centerIdx = total / 2 + rotationOffset;
    if (dir < 0 && Math.floor(centerIdx - WINDOW_HALF) > 0) { rotationOffset -= SWIPE_STEP; _enterFromLeft = true; renderFanWindow(); }
    else if (dir > 0 && Math.ceil(centerIdx + WINDOW_HALF) < total - 1) { rotationOffset += SWIPE_STEP; _enterFromLeft = false; renderFanWindow(); }
  }

  // 把牌从扇形取出、跟随手指（上滑拖出）
  function startTouchDragOut(globalIdx, tx, ty) {
    const card = currentDeck[globalIdx];
    if (!card) return null;
    const srcEl = fanCardEls.find(el => parseInt(el.dataset.globalIdx) === globalIdx);
    if (!srcEl) return null;
    // 记录扇形中当前尺寸（已含 fanScale 缩放），拖拽中保持与扇形一致
    srcEl.style.transition = 'none';
    const layW = srcEl.offsetWidth, layH = srcEl.offsetHeight;   // 布局尺寸（图片真实比例）
    const srcRect = srcEl.getBoundingClientRect();   // 视觉初始位置（含扇形排布）
    const cw = layW * fanScale, ch = layH * fanScale;   // 拖拽视觉尺寸（未旋转，用于放手定位）
    const startLeft = srcRect.left, startTop = srcRect.top;
    const offsetX = tx - startLeft, offsetY = ty - startTop;

    fanScroll.style.pointerEvents = 'none';
    fanCardEls = fanCardEls.filter(el => el !== srcEl);
    srcEl.classList.remove('preselected');
    srcEl.style.transformOrigin = '50% 50%';
    srcEl.style.position = 'fixed';       // 不脱离 fanScroll，避免触摸被取消
    srcEl.style.left = startLeft + 'px';
    srcEl.style.top  = startTop + 'px';
    srcEl.style.zIndex = '9999';
    srcEl.style.pointerEvents = 'none';
    srcEl.style.transform = 'rotate(-5deg) scale(' + fanScale + ')';   // 保留扇形缩放，大小与扇形一致
    const inner = srcEl.querySelector('.card-inner');
    if (inner) {
      const isNoir = document.body.dataset.theme === 'noir';
      inner.style.boxShadow = isNoir ? '0 8px 24px rgba(0,0,0,.28)' : '0 8px 32px rgba(180,100,255,0.4)';
      inner.style.borderColor = isNoir ? '#17171a' : '#b080ff';
    }
    return { srcEl, cw, ch, card, gi: globalIdx, offsetX, offsetY, layW, layH };
  }

  fanScroll.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;               // 只响应左键 / 触摸
    const cardEl = e.target.closest('.fan-card');
    const gi = cardEl ? parseInt(cardEl.dataset.globalIdx) : -1;
    // 按在牌上 → 立即选中凸出（单点=选中，可直接拖动）
    if (gi >= 0) selectFanCardMobile(gi);
    _fanTouch = {
      sx: e.clientX, sy: e.clientY,
      moved: false, mode: null,
      gi,
      drag: null,
    };
    try { fanScroll.setPointerCapture(e.pointerId); } catch (_) {}
  });

  fanScroll.addEventListener('pointermove', (e) => {
    if (!_fanTouch) return;
    const dx = e.clientX - _fanTouch.sx;
    const dy = e.clientY - _fanTouch.sy;

    if (Math.hypot(dx, dy) > 10) _fanTouch.moved = true;

    // 模式判定：按在牌上任意方向移动→直接拖出；按在空白横向滑动→翻页
    // （空白处竖直滑动缩放由全局 handler 处理，覆盖整个页面空白区）
    if (!_fanTouch.mode) {
      if (_fanTouch.gi >= 0 && Math.hypot(dx, dy) > 18) {
        _fanTouch.mode = 'drag';
      } else if (_fanTouch.gi < 0 && Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(dy)) {
        _fanTouch.mode = 'swipe';
      }
    }

    if (_fanTouch.mode === 'drag') {
      e.preventDefault();
      if (!_fanTouch.drag) {
        _fanTouch.drag = startTouchDragOut(_fanTouch.gi, _fanTouch.sx, _fanTouch.sy);
        if (!_fanTouch.drag) { _fanTouch.mode = 'swipe'; return; }
      }
      _fanTouch.drag.srcEl.style.left = (e.clientX - _fanTouch.drag.offsetX) + 'px';
      _fanTouch.drag.srcEl.style.top  = (e.clientY - _fanTouch.drag.offsetY) + 'px';
    } else if (_fanTouch.mode === 'swipe') {
      e.preventDefault();
    }
  }, { passive: false });

  fanScroll.addEventListener('pointerup', (e) => {
    if (!_fanTouch) return;
    const dx = e.clientX - _fanTouch.sx;
    const dy = e.clientY - _fanTouch.sy;
    const st = _fanTouch;
    _fanTouch = null;
    _suppressClick = true;
    if (e.cancelable) e.preventDefault();   // 抑制合成 click，避免重复触发
    setTimeout(() => { _suppressClick = false; }, 0);

    if (st.mode === 'drag' && st.drag) {
      // 拖出结束 → 放到桌面
      const d = st.drag;
      d.srcEl.remove();
      fanScroll.style.pointerEvents = '';
      let relX = e.clientX - d.cw / 2;
      let relY = e.clientY - d.ch / 2;
      relX = Math.max(0, Math.min(relX, window.innerWidth - d.cw));
      relY = Math.max(60, Math.min(relY, window.innerHeight - d.ch));
      placeCardAt(d.card, d.gi, relX, relY, d.layW, d.layH);
    } else if (st.mode === 'swipe' && st.moved && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      // 左右滑动翻页
      fanStep(dx > 0 ? -1 : 1);
    } else if (!st.moved) {
      // 轻点牌已在 pointerdown 时选中凸出；单击空白 → 取消选中
      if (st.gi < 0) deselectFanCardMobile();
    }
  });

  // 指针被系统打断（来电/手势等）时的兜底：已拖出的牌照常放下
  fanScroll.addEventListener('pointercancel', (e) => {
    if (!_fanTouch) { fanScroll.style.pointerEvents = ''; return; }
    const st = _fanTouch;
    _fanTouch = null;
    if (st.drag) {
      const d = st.drag;
      d.srcEl.remove();
      fanScroll.style.pointerEvents = '';
      let relX = e.clientX - d.cw / 2;
      let relY = e.clientY - d.ch / 2;
      relX = Math.max(0, Math.min(relX, window.innerWidth - d.cw));
      relY = Math.max(60, Math.min(relY, window.innerHeight - d.ch));
      placeCardAt(d.card, d.gi, relX, relY, d.layW, d.layH);
    } else {
      fanScroll.style.pointerEvents = '';
    }
  });

  // ===== 全局空白处竖直滑动：上滑放大 / 下滑缩小（桌面 + 扇形空白都有效） =====
  let _docZoom = null;
  const ZOOM_MIN = 0.6, ZOOM_MAX = 1.8;
  function isInteractiveTarget(t) {
    return !!(t && t.closest && t.closest(
      '.fan-card, .placed-card, .drawer, .drawer-item, .drawer-tab, .side-tab, ' +
      'button, a, input, textarea, .fan-arrow, .record-item, #recordPage, #captureOverlay, #cardZoom'
    ));
  }
  // 应用缩放：扇形牌与桌面放置牌同步（扇形牌缩放时禁用过渡，避免滞后）
  function applyFanScale() {
    fanCardEls.forEach(el => {
      el.style.transition = 'none';
      applyCardPosition(el, parseInt(el.dataset.globalIdx));
    });
    // 桌面牌跟随缩放，但补偿 left/top 让视觉中心不变 → 原地放大、不上下/左右乱动
    placedCards.forEach(p => {
      if (!p.isConnected) return;
      const r = p.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      p.style.transform = 'scale(' + fanScale + ')';
      const r2 = p.getBoundingClientRect();
      p.style.left = (parseFloat(p.style.left) - ((r2.left + r2.width / 2) - cx)) + 'px';
      p.style.top  = (parseFloat(p.style.top)  - ((r2.top  + r2.height / 2) - cy)) + 'px';
    });
  }
  function restoreFanTransitions() {
    fanCardEls.forEach(el => { el.style.transition = ''; });
  }

  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (isInteractiveTarget(e.target)) { _docZoom = null; return; }
    _docZoom = { sx: e.clientX, sy: e.clientY, start: fanScale, mode: null };
  });
  document.addEventListener('pointermove', (e) => {
    if (!_docZoom) return;
    const dx = e.clientX - _docZoom.sx;
    const dy = e.clientY - _docZoom.sy;
    if (!_docZoom.mode && Math.abs(dy) > 18 && Math.abs(dy) > Math.abs(dx)) {
      _docZoom.mode = 'zoom';
    }
    if (_docZoom.mode === 'zoom') {
      e.preventDefault();
      const delta = _docZoom.sy - e.clientY;   // 上滑 → 放大
      fanScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, _docZoom.start + delta * 0.002));
      applyFanScale();
    }
  }, { passive: false });
  function endDocZoom() {
    if (_docZoom && _docZoom.mode === 'zoom') restoreFanTransitions();
    _docZoom = null;
  }
  document.addEventListener('pointerup', endDocZoom);
  document.addEventListener('pointercancel', endDocZoom);
}

});

captureOverlay.addEventListener('pointerdown', (e) => {
  if (e.target !== captureOverlay) return;
  _selStart = { x: e.clientX, y: e.clientY };
  captureRect.style.display = 'block';
  captureRect.style.left = e.clientX + 'px';
  captureRect.style.top  = e.clientY + 'px';
  captureRect.style.width  = '0px';
  captureRect.style.height = '0px';

captureOverlay.addEventListener('pointermove', (e) => {
  if (!_selStart) return;
  const x = Math.min(_selStart.x, e.clientX);
  const y = Math.min(_selStart.y, e.clientY);
  const w = Math.abs(e.clientX - _selStart.x);
  const h = Math.abs(e.clientY - _selStart.y);
  captureRect.style.left = x + 'px';
  captureRect.style.top  = y + 'px';
  captureRect.style.width  = w + 'px';
  captureRect.style.height = h + 'px';
});
captureOverlay.addEventListener('pointerup', (e) => {
  if (!_selStart) return;
  _selStart = null;

    captureRect.style.display = 'none';

  captureTip.textContent = '已选择区域，点下方保存';
  captureConfirm.classList.add('show');
  captureCancel.classList.add('show');
});

captureCancel.addEventListener('click', () => {
  captureOverlay.classList.remove('active');
  captureRect.style.display = 'none';
  captureConfirm.classList.remove('show');
  captureCancel.classList.remove('show');
});

captureConfirm.addEventListener('click', async () => {
  const r = captureRect.getBoundingClientRect();
  captureOverlay.style.display = 'none';   // 截图时隐藏选区工具
  try {
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#0d001a',
      scale: Math.min(window.devicePixelRatio || 2, 2),
      useCORS: true,
      logging: false,
    });
    const s = Math.min(window.devicePixelRatio || 2, 2);
    const sw = Math.max(1, Math.round(r.width * s));
    const sh = Math.max(1, Math.round(r.height * s));
    const sx = Math.max(0, Math.round(r.left * s));
    const sy = Math.max(0, Math.round(r.top * s));
    const crop = document.createElement('canvas');
    crop.width = sw; crop.height = sh;
    crop.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    // 压缩到最大宽 900，存 JPEG
    const maxW = 900;
    const sc = Math.min(1, maxW / crop.width);
    const cw = Math.round(crop.width * sc);
    const ch = Math.round(crop.height * sc);
    const small = document.createElement('canvas');
    small.width = cw; small.height = ch;
    small.getContext('2d').drawImage(crop, 0, 0, cw, ch);
    _captureDataUrl = small.toDataURL('image/jpeg', 0.85);
  } catch (err) {
    console.error('截图失败', err);
    _captureDataUrl = null;
  } finally {
    captureOverlay.style.display = '';
    captureOverlay.classList.remove('active');
    captureRect.style.display = 'none';
    captureConfirm.classList.remove('show');
    captureCancel.classList.remove('show');
  }
  if (_captureDataUrl) {
    openRecordPage(null);
  } else {
    captureTip.textContent = '截图失败，请重试';
    captureOverlay.classList.add('active');
  }
});

// —— 记录页 ——
function openRecordPage(record) {
  if (record) {
    _viewingRecordId = record.id;
    rpTitle.textContent = '✦ 记 录 详 情 ✦';
    rpPhoto.innerHTML = `<img src="${record.img}" alt="记录">`;
    rpQuestion.value = record.question || '';
    rpInterp.value = record.interp || '';
    rpSave.textContent = '更新';
  } else {
    _viewingRecordId = null;
    rpTitle.textContent = '✦ 新 记 录 ✦';
    rpPhoto.innerHTML = _captureDataUrl ? `<img src="${_captureDataUrl}" alt="截图">` : '';
    rpQuestion.value = '';
    rpInterp.value = '';
    rpSave.textContent = '保存';
  }
  recordPage.classList.add('active');
}

function closeRecordPage() {
  recordPage.classList.remove('active');
  _captureDataUrl = null;
  _viewingRecordId = null;
}

rpSave.addEventListener('click', () => {
  const question = rpQuestion.value.trim();
  const interp = rpInterp.value.trim();
  const records = loadRecords();
  if (_viewingRecordId) {
    const idx = records.findIndex(r => r.id === _viewingRecordId);
    if (idx >= 0) {
      records[idx].question = question;
      records[idx].interp = interp;
      records[idx].ts = Date.now();
    }
  } else {
    if (!_captureDataUrl) { alert('请先截图再保存'); return; }
    records.unshift({
      id: 'rec_' + Date.now(),
      img: _captureDataUrl,
      question, interp, ts: Date.now(),
    });
  }
  persistRecords(records);
  renderRecords();
  closeRecordPage();
});

rpCancel.addEventListener('click', closeRecordPage);

// —— 记录抽屉渲染 ——
function renderRecords() {
  const grid = document.getElementById('recGrid');
  const records = loadRecords();
  if (!records.length) {
    grid.innerHTML = '<div class="record-empty">暂无记录<br>点底部相机按钮截图并记录解读</div>';
    return;
  }
  grid.innerHTML = records.map(r => `
    <div class="record-item" data-id="${r.id}">
      <img src="${r.img}" alt="记录">
      <div class="ri-info">
        <div class="ri-q">${r.question || '（无问题）'}</div>
        <div class="ri-date">${new Date(r.ts).toLocaleString()}</div>
      </div>
      <button type="button" class="ri-delete" aria-label="删除这条记录" title="删除">✕</button>
    </div>
  `).join('');
  grid.querySelectorAll('.record-item').forEach(item => {
    const delBtn = item.querySelector('.ri-delete');
    if (delBtn) delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const rec = loadRecords().find(x => x.id === item.dataset.id);
      if (!rec) return;
      if (!confirm('确定删除这条记录？')) return;
      const records = loadRecords().filter(x => x.id !== item.dataset.id);
      persistRecords(records);
      renderRecords();
    });
    item.addEventListener('click', () => {
      const rec = loadRecords().find(x => x.id === item.dataset.id);
      if (rec) {
        drawerRec.classList.remove('open');
        openRecordPage(rec);
      }
    });
  });
}

function setAstroDiceOnDesk(visible) {
  astroDicePanel.classList.toggle('open', visible);
  astroDicePanel.setAttribute('aria-hidden', String(!visible));
  astroDiceToggle.classList.toggle('active', visible);
  astroDiceToggle.title = visible ? '再次投掷占星骰子' : '投掷占星骰子';
  astroDiceToggle.setAttribute('aria-label', astroDiceToggle.title);
  astroDiceToggle.setAttribute('aria-expanded', String(visible));
  astroDiceClose.classList.toggle('visible', visible);
  astroDiceClose.setAttribute('aria-hidden', String(!visible));
  if (visible) [drawerDeck, drawerRec].forEach(drawer => drawer.classList.remove('open'));
}

function astroRandomIndex(length) {
  if (globalThis.crypto?.getRandomValues) {
    const value = new Uint32Array(1);
    globalThis.crypto.getRandomValues(value);
    return value[0] % length;
  }
  return Math.floor(Math.random() * length);
}

function animateAstroDie(die, values, finalValue, index) {
  return new Promise(resolve => {
    const throwX = [-310, -35, 300][index];
    const throwY = [105, -190, 85][index];
    const bounceX = [28, -18, -30][index];
    die.style.setProperty('--throw-x', `${throwX}px`);
    die.style.setProperty('--throw-y', `${throwY}px`);
    die.style.setProperty('--bounce-x', `${bounceX}px`);
    die.classList.remove('rolling');
    void die.offsetWidth;
    die.classList.add('rolling');
    const valueEl = die.querySelector('.die-value');
    const ticker = setInterval(() => {
      renderAstroValue(valueEl, values[astroRandomIndex(values.length)]);
    }, 65);
    setTimeout(() => {
      clearInterval(ticker);
      renderAstroValue(valueEl, finalValue);
      die.classList.remove('rolling');
      resolve();
    }, 920);
  });
}

async function rollAstroDice() {
  if (astroDiceRolling) return;
  astroDiceRolling = true;
  setAstroDiceOnDesk(true);
  const dice = [...astroDicePanel.querySelectorAll('.astro-die')];
  const results = astroDiceSets.map(values => values[astroRandomIndex(values.length)]);
  await Promise.all(dice.map((die, index) => animateAstroDie(die, astroDiceSets[index], results[index], index)));
  astroDiceRolling = false;
}

astroDiceToggle.addEventListener('click', rollAstroDice);

  if (!astroDiceRolling) setAstroDiceOnDesk(false);
});

<script>
/* ============================================================
   页面配色：四套主题（与 web 黑猫占卜桌共用 key 与默认值）
   ============================================================ */
(function () {
  var THEME_KEY = 'magiccat_reading_theme';
  var THEMES = ['mystic', 'noir', 'parchment', 'dopamine'];
  var PAGE_BG = {
    mystic: '#0d001a',
    noir: '#f4f1eb',
    parchment: '#27170f',
    dopamine: '#f9eaf2'
  };
  var toggle = document.getElementById('themeToggle');
  var sheet = document.getElementById('themeSheet');
  var backdrop = document.getElementById('themeSheetBackdrop');
  var cards = [].slice.call(document.querySelectorAll('#themeSheet .ts-card'));
  var metaColor = document.querySelector('meta[name="theme-color"]');

  function applyReadingTheme(theme, persist) {
    var next = THEMES.indexOf(theme) >= 0 ? theme : 'mystic';
    if (next === 'mystic') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', next);
    /* iOS 橡皮筋区域 / 状态栏跟随主题 */
    document.documentElement.style.backgroundColor = PAGE_BG[next];
    if (metaColor) metaColor.setAttribute('content', PAGE_BG[next]);
    cards.forEach(function (card) {
      var active = card.getAttribute('data-theme') === next;
      card.classList.toggle('active', active);
      card.setAttribute('aria-pressed', String(active));
    });
    if (persist !== false) {
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    }
  }

  function openSheet() {
    sheet.classList.add('open');
    backdrop.classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');
  }
  function closeSheet() {
    sheet.classList.remove('open');
    backdrop.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }

  toggle.addEventListener('click', function () {
    if (sheet.classList.contains('open')) closeSheet(); else openSheet();
  });
  backdrop.addEventListener('click', closeSheet);
  /* 选中配色后面板保持打开，方便连续对比；点空白或再次点按钮收起 */
  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      applyReadingTheme(card.getAttribute('data-theme'));
      /* 该配色若配了专属牌组（雾糖奇遇 → 小小奇遇雷诺曼），跟着换过去 */
      try {
        var deck = typeof deckForTheme === 'function' ? deckForTheme(card.getAttribute('data-theme')) : null;
        if (deck && typeof selectDeckAndOpen === 'function') selectDeckAndOpen(deck);
      } catch (e) {}
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
  });

  var saved = 'mystic';
  try { saved = localStorage.getItem(THEME_KEY) || 'mystic'; } catch (e) {}
  applyReadingTheme(saved, false);
})();
</script>
